[package]
name = "my-thing"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
evdev = { version = "0.13.2", optional = true }
slint = { version = "1.18.1", default-features = false, features = ["std",  "compat-1-2"] }

[build-dependencies]
slint-build = "1.18.1"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg"]
# On the device the app is a Wayland client of the image's Weston, which rotates the
# portrait panel. Slint then renders unrotated, so femtovg (GPU) keeps crisp text;
# with linuxkms + SLINT_KMS_ROTATION it draws all text as outlines, which looks bold.
device  = ["slint/backend-winit-wayland", "slint/renderer-femtovg", "dep:evdev"]
