require conf/distro/superbird.conf

# Not just "my-thing": DISTRO is added to OVERRIDES, and it must not clash with
# the my-thing recipe name (RDEPENDS:${PN} would turn into a distro override).
DISTRO = "my-thing-distro"
DISTRO_NAME = "my-thing"
DISTRO_VERSION = "0.1.0"

# The device shows up as my-thing.local over USB-CDC-NCM.
SUPERBIRD_HOSTNAME = "my-thing"
SUPERBIRD_MDNS_SERVICE_NAME = "my-thing"
SUPERBIRD_USB_GADGET_NAME = "my-thing"
SUPERBIRD_USB_GADGET_MANUFACTURER = "my-thing"
SUPERBIRD_USB_GADGET_PRODUCT = "my-thing"

# Weston background (800x480 landscape PNG), shown until my-thing draws.
# The u-boot logo is set in recipes-bsp/superbird-logo/superbird-logo.bbappend.
SUPERBIRD_WESTON_SPLASH_IMAGE = "my-thing-splash.png"
