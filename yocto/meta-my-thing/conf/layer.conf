BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "my-thing"
BBFILE_PATTERN_my-thing := "^${LAYERDIR}/"
BBFILE_PRIORITY_my-thing = "20"

LAYERVERSION_my-thing = "1"
LAYERSERIES_COMPAT_my-thing = "scarthgap wrynose"
LAYERDEPENDS_my-thing = "core superbird meson"

# Root of the my-thing repo (this layer lives at <repo>/yocto/meta-my-thing). The recipe is
# built from it with externalsrc (see yocto/kas/my-thing.yml). kas-container mounts this
# repo at /repo, so no extra mount is needed.
MY_THING_SRC := "${@os.path.normpath(d.getVar('LAYERDIR') + '/../..')}"
