# Device (Car Thing) cross-build settings. Desktop builds are unaffected:
# everything below is either scoped to aarch64 or target-suffixed.
# Relative paths resolve from the crate root. `sdk` is a symlink to the
# installed Yocto SDK (see README).

[alias]
device-build = "build --release --target aarch64-unknown-linux-gnu --no-default-features --features device"
device-run = "run --release --target aarch64-unknown-linux-gnu --no-default-features --features device"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/sdk-cc.sh"
# `cargo run` for this target copies the binary to the device and runs it there.
runner = "scripts/device-run.sh"

[env]
# C code compiled by build scripts (cc-rs) for the target.
CC_aarch64_unknown_linux_gnu = { value = "scripts/sdk-cc.sh", relative = true }
AR_aarch64_unknown_linux_gnu = { value = "sdk/sysroots/x86_64-pokysdk-linux/usr/bin/aarch64-poky-linux/aarch64-poky-linux-ar", relative = true }
# System libraries via pkg-config. LIBDIR replaces the default search path so
# host .pc files are never used; SYSROOT_DIR rewrites -I/-L into the SDK.
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu = { value = "sdk/sysroots/cortexa53-poky-linux/usr/lib/pkgconfig", relative = true }
PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu = { value = "sdk/sysroots/cortexa53-poky-linux", relative = true }
